# PURL configuration for http://purl.obolibrary.org/obo/gsso

idspace: GSSO
base_url: /obo/gsso

base_redirect: https://github.com/Superraptor/GSSO

products:
- gsso.owl: https://raw.githubusercontent.com/Superraptor/GSSO/master/gsso.owl
- gsso.obo: https://raw.githubusercontent.com/Superraptor/GSSO/master/gsso.obo
- gsso.json: https://raw.githubusercontent.com/Superraptor/GSSO/master/gsso.json

term_browser: ontobee
example_terms:
- GSSO_000130

entries:
- exact: /tracker
  replacement: https://github.com/Superraptor/GSSO/issues

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/Superraptor/GSSO/master/releases/

- prefix: /about/
  replacement: http://www.ontobee.org/browser/rdf.php?o=GSSO&iri=http://purl.obolibrary.org/obo/
  tests:
  - from: /about/GSSO_000130
    to: http://www.ontobee.org/browser/rdf.php?o=GSSO&iri=http://purl.obolibrary.org/obo/GSSO_000130

- prefix: /web/
  replacement: https://gsso.research.cchmc.org/#!/entry?iri=http://purl.obolibrary.org/obo/
  tests:
  - from: /about/GSSO_000130
    to: https://gsso.research.cchmc.org/#!/entry?iri=http://purl.obolibrary.org/obo/GSSO_000130

- prefix: /subsets/
  replacement: https://raw.githubusercontent.com/Superraptor/GSSO/master/subsets/

- prefix: /imports/
  replacement: https://raw.githubusercontent.com/Superraptor/GSSO/master/imports/

- prefix: /docs/
  replacement: https://raw.githubusercontent.com/Superraptor/GSSO/master/docs/

- exact: /
  replacement: https://github.com/Superraptor/GSSO/

license:
  url: http://www.apache.org/licenses/LICENSE-2.0
  label: Apache 2.0 License

publications:
- id: https://doi.org/10.1093/jamia/ocab095
  title: "The Gender, Sex, and Sexual Orientation (GSSO) ontology: providing a modern terminology for LGBTQ+ health and research"

usages:
- user: https://github.com/monarch-initiative/mondo
  description: Alignment of social determinants and demographic attributes.
- user: https://github.com/EBISPOT/efo
  description: Experimental Factor Ontology mapping for gender and sexual orientation concepts.
- user: https://github.com/GenEpiO/genepio
  description: Genomic Epidemiology Ontology reference terminology.
- user: https://github.com/scdo-ontology/scdo-ontology
  description: Sickle Cell Disease Ontology demographics.
- user: https://github.com/pride-utilities/pride-ontology
  description: PRIDE proteomics repository metadata vocabulary.
- user: https://www.glbthistory.org/
  description: GLBT Historical Society Museum and Archives cataloging and subject headings pilot.